name: Build APK

# Builds the app on every push to a fork branch and uploads the APK as a
# downloadable artifact. Upstream's own workflows (checks.yml etc.) are left
# untouched so upstream merges stay conflict-free.

on:
  push:
    branches-ignore: [ master, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build free-flavor APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Configure parallel build
        run: echo "org.gradle.parallel=true" >> local.properties

      - name: Build signed release APK
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          ./gradlew :app:assembleFreeRelease \
            -PreleaseStoreFile="$RUNNER_TEMP/release.keystore" \
            -PreleaseStorePassword="$SIGNING_STORE_PASSWORD" \
            -PreleaseKeyAlias="$SIGNING_KEY_ALIAS" \
            -PreleaseKeyPassword="$SIGNING_KEY_PASSWORD"
          rm -f "$RUNNER_TEMP/release.keystore"
          mkdir -p out
          cp app/build/outputs/apk/free/release/app-free-release.apk "out/podcasts-${GITHUB_SHA::7}.apk"

      - name: Build debug APK (no signing secrets configured)
        if: env.SIGNING_KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::Signing secrets are not set, so this is a debug build signed with a throwaway key. It cannot be installed as an update over a previous build."
          ./gradlew :app:assembleFreeDebug
          mkdir -p out
          cp app/build/outputs/apk/free/debug/app-free-debug.apk "out/podcasts-debug-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: podcasts-apk-${{ github.sha }}
          path: out/*.apk
          retention-days: 30
